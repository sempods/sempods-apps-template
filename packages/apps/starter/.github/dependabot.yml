# Version updates. Security updates are enabled in the repository settings.
version: 2

updates:
  # The pinned `uses:` SHAs in the workflows are supply-chain dependencies too.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Reviewed releases of shared sempods actions need no waiting period;
    # third-party actions keep Dependabot's default three-day cooldown.
    cooldown:
      exclude:
        - 'sempods/.github/*'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Dependabot's npm ecosystem updates pnpm-lock.yaml too, and every
  # package.json of the pnpm workspace: the root and each app.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'increase'
    # Regular version updates wait three days; Dependabot also attempts an age
    # gate for newly resolved transitive dependencies. Security updates skip
    # it. sempods releases are reviewed upstream and need no waiting period.
    cooldown:
      default-days: 3
      exclude:
        - '@sempods/*'
    # Ignore rules with update-types stop only version updates; security
    # updates for these packages still arrive.
    ignore:
      # BEGIN OWNER SEMPODS UPDATES
      # No version PRs for the SDK and the tooling. Remove the entry between
      # these markers to receive them; updates keep this section as it is.
      - dependency-name: '@sempods/*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      # END OWNER SEMPODS UPDATES
      # Match the Node 24 runtime baseline; review runtime and typings together.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    # A dependency joins the first group it matches. Both SDK packages move
    # together in one PR; the tooling has its own, since it brings a starter
    # migration (update skill). Security updates move only affected packages:
    # their SDK group joins advisories for both, and a PR that moves one is
    # completed with sdk-update (Update the SDK in the app workflow).
    groups:
      sempods-sdk:
        patterns:
          - '@sempods/app-sdk'
          - '@sempods/client-sdk'
      sempods-sdk-security:
        applies-to: 'security-updates'
        patterns:
          - '@sempods/app-sdk'
          - '@sempods/client-sdk'
      sempods-apps:
        patterns:
          - '@sempods/apps'
      npm:
        patterns:
          - '*'
        exclude-patterns:
          - '@sempods/*'
        update-types:
          - 'minor'
          - 'patch'
