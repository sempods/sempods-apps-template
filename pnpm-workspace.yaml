packages:
  - 'apps/*'

# Added dependencies get exact versions; installs require the Node version
# from engines.
saveExact: true
engineStrict: true

# Scripts fail on dependencies out of sync with the manifests instead of
# installing on their own, so check never rewrites pnpm-lock.yaml.
verifyDepsBeforeRun: error

# Dependencies run no install scripts: pnpm fails an install that would need
# one (strictDepBuilds). Approve a package deliberately under allowBuilds.

# No minimum release age at install time: pnpm would otherwise install a
# dependency younger than a day anyway when nothing older fits, add it to this
# file and stop the next `pnpm run` (verifyDepsBeforeRun). New releases wait in
# Dependabot's cooldown instead (.github/dependabot.yml), before they reach
# the lockfile.
minimumReleaseAge: 0

overrides:
  # The Markdown link check (unified-engine 11 and its npm config loader)
  # still requests the deprecated glob 10; glob 13 replaces it in that tree.
  unified-engine>glob: 13.0.6
  '@npmcli/map-workspaces>glob': 13.0.6
  '@npmcli/package-json>glob': 13.0.6
