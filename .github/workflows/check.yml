name: Check
# Checks the owner's apps as they are. In the template repository it also
# checks the tooling itself: script tests, Markdown links, a self-test in an
# isolated copy that never touches apps or apps.json, and the packed package
# installed into a fresh repository.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # Required status check name in repository rulesets; keep it stable.
    name: Apps and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version that packageManager in package.json pins.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check --standalone all
      - if: github.repository == 'sempods/sempods-apps-template'
        run: node packages/apps/maintainer/check-tooling.mjs
      - if: github.repository == 'sempods/sempods-apps-template'
        run: node packages/apps/maintainer/self-test.mjs
      - if: github.repository == 'sempods/sempods-apps-template'
        run: node packages/apps/maintainer/pack-test.mjs
