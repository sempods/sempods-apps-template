name: Check
# Checks every app and the template tooling: script tests, a freshly generated
# app (including a refused rerun), Markdown links, lint, typecheck, build and
# tests, and one standalone install/build outside the workspace.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Apps and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The generated app proves the skeleton; its ID does not collide with
      # an owner's app, and a second run must change nothing.
      - run: npm run new-app -- ci-sample --title "CI sample"
      - run: |
          cp apps.json "$RUNNER_TEMP/apps.json"
          if npm run new-app -- ci-sample --skip-install; then
            echo "A rerun of new-app must be refused." >&2
            exit 1
          fi
          cmp apps.json "$RUNNER_TEMP/apps.json"
      - run: npm run check -- --standalone ci-sample
