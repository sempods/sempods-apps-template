# Version updates. Security updates are enabled in the repository settings.
version: 2

updates:
  # The pinned `uses:` SHAs in the workflows are supply-chain dependencies too.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Reviewed releases of shared sempods actions need no waiting period;
    # third-party actions keep Dependabot's default three-day cooldown.
    cooldown:
      exclude:
        - 'sempods/.github/*'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: '@sempods/*'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # The generator skeleton is outside the apps/* npm workspaces.
  - package-ecosystem: 'npm'
    directory: '/.sempods/skeleton/app'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: '@sempods/*'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
