# Version updates. Security updates are enabled in the repository settings.
version: 2

updates:
  # The pinned `uses:` SHAs in the workflows are supply-chain dependencies too.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Reviewed releases of shared sempods actions need no waiting period;
    # third-party actions keep Dependabot's default three-day cooldown.
    cooldown:
      exclude:
        - 'sempods/.github/*'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: '@sempods/*'
      # The root import checker requires the TypeScript 6 compiler API.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # The Markdown link check is template tooling too. Template releases move
      # its majors, so a copy does not diverge from the template's entries.
      - dependency-name: 'remark'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'remark-validate-links'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'unified-engine'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'markdown-extensions'
        update-types:
          - 'version-update:semver-major'
      # Match the Node 24 runtime baseline; review runtime and typings together.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # The generator skeleton is outside the apps/* npm workspaces.
  - package-ecosystem: 'npm'
    directory: '/.sempods/skeleton/app'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: '@sempods/*'
      # Match the Node 24 runtime baseline; review runtime and typings together.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
